services:
  postgres:
    image: postgres:16
    container_name: opspilot-postgres
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - opspilot_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: opspilot-redis
    ports:
      - "6380:6379"

volumes:
  opspilot_postgres_data: