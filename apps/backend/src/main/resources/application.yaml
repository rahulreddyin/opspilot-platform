server:
  port: ${SERVER_PORT:8080}

app:
  email-verification:
    base-url: ${APP_EMAIL_VERIFICATION_BASE_URL:http://localhost:8080}
    from-email: ${APP_EMAIL_FROM:your-email@gmail.com}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.mail: INFO
    org.springframework.boot.autoconfigure.mail: INFO
    jakarta.mail: INFO
    javax.mail: INFO